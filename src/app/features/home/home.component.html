<div class="app-container">
  <!-- Barra de navegación -->
  <div class="toolbar">
    <div class="toolbar-left">
      <a class="toolbar-title active" routerLink="/home">Inicio</a>
      <a class="toolbar-title" routerLink="/register-solicitudes"
        >Registro de Solicitudes</a
      >
      <a class="toolbar-title" routerLink="/solicitudes">Solicitudes</a>
      <a class="toolbar-title" routerLink="/control-refacciones"
        >Control de Refacciones</a
      >
      <a class="toolbar-title" routerLink="/refacciones">Refacciones</a>
      <a class="toolbar-title" routerLink="/accesos-permisos"
        >Accesos/Permisos</a
      >
      <a class="toolbar-title" routerLink="/profile">Perfil</a>
    </div>
    <div class="toolbar-right">
      <div class="dropdown">
        <span class="profile">
          <i class="fas fa-user"></i> Perfil
          <i class="fa fa-caret-down"></i>
        </span>
        <div class="dropdown-content">
          <a (click)="logout()">Cerrar sesión</a>
        </div>
      </div>
    </div>
  </div>

  <div class="home-container">
    <div class="logo">
      <!-- Logo con estilos para mejor visualización -->
      <img
        src="assets/images/logo.jpg"
        alt="Logo de la empresa"
        class="logo-image"
        onerror="this.src='https://via.placeholder.com/200x80/2c3e50/ffffff?text=Logo+Sinsetec';this.onerror=null;"
      />
    </div>

    <main class="main-content">
      <section class="welcome-section">
        <h2>Bienvenido a Sinsetec</h2>
        <p>
          Nuestra meta es ser la mejor opción en servicios de reparación y
          mantenimiento para maquinaria y equipo industrial en General.
        </p>
      </section>
    </main>
  </div>
</div>
