<div class="auth-container">
  <div class="auth-card">
    <!-- MODO SOLICITUD -->
    <div *ngIf="!isResetMode">
      <div class="auth-header">
        <h2>RECUPERAR CONTRASEÑA</h2>
        <p>Ingresa tu email para recibir un enlace de recuperación</p>
      </div>

      <form
        class="auth-form"
        [formGroup]="requestForm"
        (ngSubmit)="onRequestSubmit()"
      >
        <div class="form-group">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            formControlName="email"
            placeholder="Ingresa tu email"
          />
          <div
            *ngIf="
              requestForm.get('email')?.invalid &&
              requestForm.get('email')?.touched
            "
            class="error-message"
          >
            Email válido es requerido
          </div>
        </div>

        <button
          type="submit"
          class="auth-button"
          [disabled]="requestForm.invalid || isLoading"
        >
          {{ isLoading ? "ENVIANDO..." : "ENVIAR ENLACE" }}
        </button>
      </form>
    </div>

    <!-- MODO RESETEO -->
    <div *ngIf="isResetMode">
      <div class="auth-header">
        <h2>NUEVA CONTRASEÑA</h2>
        <p>Ingresa tu nueva contraseña</p>
      </div>

      <form
        class="auth-form"
        [formGroup]="resetForm"
        (ngSubmit)="onResetSubmit()"
      >
        <div class="form-group">
          <label for="newPassword">Nueva Contraseña</label>
          <input
            type="password"
            id="newPassword"
            formControlName="newPassword"
            placeholder="Mínimo 6 caracteres"
          />
          <div
            *ngIf="
              resetForm.get('newPassword')?.invalid &&
              resetForm.get('newPassword')?.touched
            "
            class="error-message"
          >
            La contraseña debe tener al menos 6 caracteres
          </div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirmar Contraseña</label>
          <input
            type="password"
            id="confirmPassword"
            formControlName="confirmPassword"
            placeholder="Repite tu contraseña"
          />
          <div
            *ngIf="
              resetForm.get('confirmPassword')?.invalid &&
              resetForm.get('confirmPassword')?.touched
            "
            class="error-message"
          >
            Confirma tu contraseña
          </div>
        </div>

        <button
          type="submit"
          class="auth-button"
          [disabled]="resetForm.invalid || isLoading"
        >
          {{ isLoading ? "PROCESANDO..." : "RESTABLECER CONTRASEÑA" }}
        </button>
      </form>
    </div>

    <div class="auth-footer">
      <a (click)="goToLogin()">Volver al login</a>
    </div>
  </div>
</div>
